- aid: uber:uber-guest-rides
  name: Uber Guest Rides API
  tags:
  - Ridesharing
  - Guest
  - Trips
  - Transportation
  tags_raw:
  - Ride-Sharing
  - Guest
  - Trips
  - Transportation
  humanURL: https://developer.uber.com/docs/guest-rides/introduction
  baseURL: https://api.uber.com/v1
  properties:
  - url: https://developer.uber.com/docs/guest-rides/introduction
    type: Documentation
  - url: https://developer.uber.com/docs/guest-rides/about/u4b-api-introduction
    type: Documentation
  description: >-
    The Uber Guest Rides API enables businesses to allow their users to request rides from Uber without
    requiring an Uber account. Uses OAuth 2.0 with the guest.rides scope for authentication.
